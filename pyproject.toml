[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build]
dev-mode-dirs = ["."]

[project]
name = "amrutam-pharmaceuticals"
version = "1.0.0"
description = "Production-grade telemedicine backend for Amrutam"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "gunicorn>=22.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",

    # Redis / Caching
    "redis[hiredis]>=5.0.4",

    # Auth & Security
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    "python-multipart>=0.0.9",

    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "email-validator>=2.1.1",

    # Rate limiting
    "slowapi>=0.1.9",

    # Background tasks
    "celery[redis]>=5.3.6",

    # Observability
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.45b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24.0",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "structlog>=24.1.0",

    # Utilities
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "anyio>=4.3.0",
    "itsdangerous>=2.2.0",
    "pillow>=10.3.0",
    "aiofiles>=23.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "factory-boy>=3.3.0",
    "faker>=24.11.0",
    "ruff>=0.4.2",
    "mypy>=1.10.0",
    "bandit[toml]>=1.7.8",
    "safety>=3.2.0",
    "types-redis>=4.6.0.20240417",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["B008", "B904"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/init_db.py", "migrations/*"]

[tool.coverage.report]
show_missing = true
